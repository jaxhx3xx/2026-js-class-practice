<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>set</title>
  </head>
  <body>
    <script>
      /* 실무에서 set을 가장 유용하게 사용하는 경우는 "데이터의 중복을 허용하지 않으면서 
        특정 데이터가 존재하는지 빠른 속도로 찾아내야 하는경우"
        - 대표적인 예시로는 '최근 본 상품 목록(중복제거)', 찜한 상품 실시간 활성화 여부 체크*/

      const recentView = new Set();
      const wishList = new Set();

      //1. 본 상품을 최근 본 상품목록에 추가하는 함수
      const addrecentView = (productId) => {
        recentView.add(productId);
      };
      addrecentView("스피커");
      addrecentView("아이폰18pro");
      addrecentView("스피커");
      addrecentView("아이폰18pro");
      addrecentView("아이폰18pro");
      addrecentView("아이폰18pro");

      console.log(recentView);

      //최근 본 목록을 배열로 변환하는 함수
      recentViewArray = [...recentView]; //spread operator사용
      console.log([...recentView]);

      //장바구니에서 선택, 해제하는 함수
      const toggleWishList = (productId) => {
        if (wishList.has(productId)) {
          wishList.delete(productId);
          console.log(`${productId} 찜 해제`);
          console.log(wishList);
        } else {
          wishList.add(productId);
          console.log(`${productId} 찜 추가`);
          console.log(wishList);
        }
      };
      wishList.add("아이폰");
      wishList.add("맥립글로스");
      wishList.add("맥북");
      console.log(wishList);

      //배열로 변환하는 함수
      console.log([...wishList]); //spread operator사용

      toggleWishList("아이폰");
      toggleWishList("블루투스 스피커");
    </script>
  </body>
</html>
