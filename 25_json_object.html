<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>json</title>
  </head>
  <body>
    <script>
      /*JSON(Javascript Object Notation)
      - 데이터를 저장하거나 전송 시 많이 사용하는 데이터 교환 형식(데이터 포맷)
      - 클라이언트와 서버간의 데이터 전송 시 가장 많이 사용하는 포맷
      - Object 표기법과 동일(cf : 키에 “ ”가 있고, 선언자가 없다)
      - 프로그래밍 언어와 관계없이 사용할 수 있는 데이터 교환 형식
      - 대부분의 프로그래밍 언어에서 json을 처리할 수 있는 라이브러리를 제공 */

      /*
      2. JSON.stringify( ) : 클라이언트에서 서버로 전송시 자바스크립트 데이터를 문자열로 변환
      3. JSON.parse( ) : 서버에서 클라이언트로 전송시 문자열을 자바스크립트 객체로 변환
      */

      let person = {
        name: "정재희",
        age: 18,
        address: "봉계동",
        tel: "010-1111-2222",
      };

      let jPerson = JSON.stringify(person); //json객체로 바꾼것
      console.log(jPerson);

      let oPerson = JSON.parse(jPerson); //자바스크립트 객체로 나옴
      console.log(oPerson);

      let arr = [1, 2, 3, 4];
      console.log(arr);

      let jArr = JSON.stringify(arr); //문자열
      console.log(jArr);

      let oArr = JSON.parse(jArr); //다시 배열로
      console.log(oArr);
    </script>
  </body>
</html>
