<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>this 키워드</title>
  </head>
  <body>
    <button onclick="myFunction(this)">클릭</button>
    <select name="" id="" onchange="myFunction(this)">
      <option value="">a</option>
      <option value="">b</option>
      <option value="">c</option>
    </select>
    <script>
      /*
        - this는 사용하는 위치에 따라 **바인딩되는 대상 객체가 달라진다.**
        1. window 객체가 바인딩되는 경우 : 최상위에서 호출되거나, 함수 안에서 호출하는 경우
        2. this에 DOM(Document Object Model) : HTML/XML문서의 구조를 프로그래밍 언어가 접근하고 조작할 수 있도록 객체화 된 트리(Tree) 구조로 표현하는 표준 인터페이스 요소가 바인딩 된 경우
      */

      //1. windows
      console.log(this);
      const test = () => {
        console.log(this);
      };
      test();
      //2. DOM 객체
      function myFunction(param) {
        console.log(param);
      }
      //3. 객체 자기 자신
      let firstName = "Brad ";
      let lastName = "Pitt";
      let person = {
        firstName: "John ",
        lastName: "Doe",
        getfullName: function () {
          return this.firstName + this.lastName;
        },
      };
      console.log(person.getfullName());
    </script>
  </body>
</html>
