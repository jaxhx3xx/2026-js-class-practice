<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기본 함수 매개변수</title>
  </head>
  <body>
    <script src="js/common.js"></script>
    <script>
      /*
        - **실무**에서 많이 사용

        - 매개변수가 존재하는 함수에서 실수로 매개변수를 전달하지 않는다면? 결과에 undefined가 출력된다.

        - 이를 예방하기 위해 전통적인 방법으로 예외처리를 한다면 다음과 같다.
        function sayHello(name){
            if(name){
                ...
            }
        }
        - 일반적으로 함수 호출시 파라미터를 전달하지 않을 경우 undefined 값이 출력되며 이를 막기 위해 기본값을 설정할 수 있다. 이를 기본 함수매개변수(default parameter)라고 한다.
      */
      const sayHello = (name) => {
        if (name) {
          console.log("Hello ", name);
        }
      };
      sayHello("World");

      //ecma6
      const sayHello2 = (name = "anybody") => {
        if (name) {
          console.log("Hello ", name);
        }
      };
      sayHello2(); //Hello  anybody
      sayHello2("World");

      //실무에서 활용
      nDaysAgoFunc3(-3, "YYYY-MM-DD");
      nDaysAgoFunc3(-3);
    </script>
  </body>
</html>
