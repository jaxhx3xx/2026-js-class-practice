<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spread operator</title>
  </head>
  <body>
    <script>
      //spread operator의 활용

      //1. 배열합치기
      let arr1 = [1, 2, 3];
      let arr2 = [4, 5, 6];
      let arr3 = [...arr1, ...arr2];
      console.log(arr3);

      //2. 복사(얕은)(주소값이 다름)
      let arr4 = [7, 8, 9, 10];
      let arr5 = [...arr4];
      console.log(arr5);
      console.log(arr4 === arr5);

      //3. 객체의 형변환
      const wishList = new Set();
      wishList.add("아이폰");
      wishList.add("맥립글로스");
      wishList.add("맥북");
      console.log([...wishList]);

      //4. rest parameter : 매개변수의 개수에 관계없다.
    </script>
  </body>
</html>
